<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1a103c" />
    </linearGradient>

    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="pipeline-flow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.9" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <!-- Animated Pulse Style -->
    <style>
      @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 0.85; }
        50% { transform: scale(1.05); opacity: 1; }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-7px); }
      }
      @keyframes floatMid {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-11px); }
      }
      @keyframes dashAnim {
        to { stroke-dashoffset: -100; }
      }
      @keyframes particleMove {
        0% { transform: translate(0, 0); opacity: 0.2; }
        50% { opacity: 0.8; }
        100% { transform: translate(120px, -40px); opacity: 0; }
      }
      .anim-float-1 { animation: floatSlow 6s ease-in-out infinite; }
      .anim-float-2 { animation: floatMid 7s ease-in-out infinite 1s; }
      .anim-float-3 { animation: floatSlow 5.5s ease-in-out infinite 2s; }
      .anim-dash { stroke-dasharray: 8 6; animation: dashAnim 4s linear infinite; }
      .pulse-pill { animation: pulse 3s ease-in-out infinite; transform-origin: center; }
      .particle-1 { animation: particleMove 8s infinite linear; }
      .particle-2 { animation: particleMove 6s infinite linear 2s; }
      .particle-3 { animation: particleMove 10s infinite linear 4s; }
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        letter-spacing: -0.5px;
      }
      .sub-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
      }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="360" fill="url(#bg-grad)" rx="16" />

  <!-- Background Decorative Grid Lines -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="150" y1="0" x2="150" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="450" y1="0" x2="450" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="750" y1="0" x2="750" y2="360" />
    <line x1="900" y1="0" x2="900" y2="360" />
    <line x1="1050" y1="0" x2="1050" y2="360" />
  </g>

  <!-- Dynamic / Animated Flowing Pipeline Waves (in the subtle background) -->
  <path d="M 50,300 C 300,240 450,320 700,270 C 950,220 1080,260 1150,230" fill="none" stroke="url(#pipeline-flow)" stroke-width="4" stroke-linecap="round" class="anim-dash" opacity="0.6"/>
  <path d="M 80,320 C 320,270 480,340 730,290 C 980,240 1050,280 1180,250" fill="none" stroke="#6366f1" stroke-width="2" stroke-linecap="round" opacity="0.3" class="anim-dash" style="animation-duration: 6s;"/>

  <!-- Dynamic Floating Particles -->
  <circle cx="200" cy="100" r="3" fill="#38bdf8" class="particle-1" />
  <circle cx="850" cy="80" r="4" fill="#a855f7" class="particle-2" />
  <circle cx="1020" cy="180" r="3.5" fill="#34d399" class="particle-3" />
  <circle cx="500" cy="310" r="2.5" fill="#818cf8" class="particle-1" style="animation-delay: 3s;" />

  <!-- Animated Interactive Pipeline Stage Cards (Right-Aligned / Lower Half so Title is completely Clear) -->
  <g class="anim-float-1" transform="translate(860, 48)" filter="url(#card-shadow)">
    <rect width="280" height="66" rx="12" fill="#1e293b" fill-opacity="0.85" stroke="#334155" stroke-width="1.5"/>
    <circle cx="28" cy="33" r="14" fill="#0284c7" fill-opacity="0.25"/>
    <circle cx="28" cy="33" r="6" fill="#38bdf8"/>
    <text x="52" y="27" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="600" letter-spacing="1">STAGE 01: QUALIFICATION</text>
    <text x="52" y="47" fill="#f8fafc" font-size="14" font-family="sans-serif" font-weight="700">Lead Scoring &amp; Routing</text>
    <rect x="222" y="24" width="44" height="20" rx="10" fill="#0369a1" fill-opacity="0.35"/>
    <text x="244" y="38" text-anchor="middle" fill="#38bdf8" font-size="10" font-family="sans-serif" font-weight="700">+84%</text>
  </g>

  <g class="anim-float-2" transform="translate(830, 130)" filter="url(#card-shadow)">
    <rect width="310" height="66" rx="12" fill="#1e293b" fill-opacity="0.85" stroke="#4f46e5" stroke-width="1.5"/>
    <circle cx="28" cy="33" r="14" fill="#4f46e5" fill-opacity="0.25"/>
    <circle cx="28" cy="33" r="6" fill="#818cf8"/>
    <text x="52" y="27" fill="#a5b4fc" font-size="11" font-family="sans-serif" font-weight="600" letter-spacing="1">STAGE 02: DEAL NEGOTIATION</text>
    <text x="52" y="47" fill="#ffffff" font-size="14" font-family="sans-serif" font-weight="700">Kanban Velocity &amp; CPQ</text>
    <rect x="248" y="24" width="48" height="20" rx="10" fill="#4338ca" fill-opacity="0.4"/>
    <text x="272" y="38" text-anchor="middle" fill="#a5b4fc" font-size="10" font-family="sans-serif" font-weight="700">$185k</text>
  </g>

  <g class="anim-float-3" transform="translate(860, 212)" filter="url(#card-shadow)">
    <rect width="280" height="66" rx="12" fill="#1e293b" fill-opacity="0.85" stroke="#059669" stroke-width="1.5"/>
    <circle cx="28" cy="33" r="14" fill="#059669" fill-opacity="0.25"/>
    <circle cx="28" cy="33" r="6" fill="#34d399"/>
    <text x="52" y="27" fill="#6ee7b7" font-size="11" font-family="sans-serif" font-weight="600" letter-spacing="1">STAGE 03: CLOSED-WON</text>
    <text x="52" y="47" fill="#f0fdf4" font-size="14" font-family="sans-serif" font-weight="700">Automated Onboarding</text>
    <rect x="220" y="24" width="46" height="20" rx="10" fill="#065f46" fill-opacity="0.4"/>
    <text x="243" y="38" text-anchor="middle" fill="#34d399" font-size="10" font-family="sans-serif" font-weight="700">WIN 🏆</text>
  </g>

  <!-- Foreground Main Title & Badges (Clear, Unobstructed, Left-Aligned) -->
  <g transform="translate(64, 48)">
    <!-- Top Category Pill / Badge -->
    <g class="pulse-pill">
      <rect x="0" y="0" width="280" height="28" rx="14" fill="#1e293b" stroke="#3b82f6" stroke-width="1"/>
      <circle cx="14" cy="14" r="5" fill="#10b981" />
      <text x="28" y="19" fill="#93c5fd" font-size="12" font-family="-apple-system, sans-serif" font-weight="700" letter-spacing="0.5">OPEN-SOURCE &amp; SAAS DIRECTORY</text>
    </g>

    <!-- Main Title Heading -->
    <text x="0" y="78" fill="url(#primary-grad)" font-size="40" class="title-text" filter="url(#glow)">Awesome Sales CRM</text>
    <text x="0" y="124" fill="#ffffff" font-size="34" class="title-text">&amp; Pipeline Management</text>

    <!-- Subtitle / Meta Description -->
    <text x="0" y="164" fill="#94a3b8" font-size="15" class="sub-text" font-weight="500">
      The authoritative index of enterprise CRM platforms, Kanban pipeline boards,
    </text>
    <text x="0" y="188" fill="#94a3b8" font-size="15" class="sub-text" font-weight="500">
      self-hosted alternatives, lead automation engines, and RevOps toolchains.
    </text>

    <!-- Interactive Attribute Badges -->
    <g transform="translate(0, 222)">
      <!-- Badge 1: Hosted & Self-Hosted -->
      <g>
        <rect x="0" y="0" width="138" height="30" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
        <text x="12" y="20" fill="#cbd5e1" font-size="12" font-family="sans-serif" font-weight="600">⚡ SaaS + OpenSource</text>
      </g>
      <!-- Badge 2: AI & MCP Ready -->
      <g transform="translate(148, 0)">
        <rect x="0" y="0" width="128" height="30" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
        <text x="12" y="20" fill="#cbd5e1" font-size="12" font-family="sans-serif" font-weight="600">🤖 AI &amp; MCP Native</text>
      </g>
      <!-- Badge 3: Pipeline Velocity -->
      <g transform="translate(286, 0)">
        <rect x="0" y="0" width="144" height="30" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
        <text x="12" y="20" fill="#cbd5e1" font-size="12" font-family="sans-serif" font-weight="600">📊 Kanban Pipelines</text>
      </g>
      <!-- Badge 4: Pricing & Free Tiers -->
      <g transform="translate(440, 0)">
        <rect x="0" y="0" width="140" height="30" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
        <text x="12" y="20" fill="#cbd5e1" font-size="12" font-family="sans-serif" font-weight="600">💳 Transparent Pricing</text>
      </g>
    </g>
  </g>
</svg>
